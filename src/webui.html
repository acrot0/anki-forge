<!DOCTYPE html>
<html lang="zh-CN" data-theme="corporate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>anki-forge — 讲义变卡组</title>
<meta name="theme-color" content="#f8fafc">
<link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root { --teal: #0d9488; --teal-d: #0f766e; }
  .stagger { animation: rise .45s cubic-bezier(.16,1,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fade .3s both; } @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .pop { animation: pop .25s cubic-bezier(.34,1.5,.5,1) both; } @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .sheen { position: relative; overflow: hidden; }
  .sheen::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%); background-size: 220% 100%; background-position: 220% 0; transition: background-position .6s; }
  .sheen:hover::after { background-position: -120% 0; }
  .icon { width: 1.1em; height: 1.1em; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
  .icon-lg { width: 1.6em; height: 1.6em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="navbar bg-base-100 border-b border-base-200 sticky top-0 z-40">
  <div class="navbar-start">
    <div class="flex items-center gap-2">
      <svg class="icon icon-lg text-teal-600" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h7"/></svg>
      <span class="font-bold text-lg">anki-forge</span>
    </div>
  </div>
  <div class="navbar-center hidden sm:flex"><span class="text-sm opacity-60">讲义变卡组 · 学习工具</span></div>
  <div class="navbar-end"><a href="https://github.com/acrot0/anki-forge" class="btn btn-ghost btn-sm">GitHub</a></div>
</div>

<div class="mx-auto max-w-5xl px-4 pt-8 pb-20">
  <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">生成、学习、记住。</h1>
      <p class="text-sm opacity-70 mt-1">讲义进卡片出，FSRS 间隔重复算法安排每一次复习。</p>
    </div>
    <div class="badge badge-lg gap-2 bg-base-200 border-base-300"><span id="anki-dot" class="inline-block w-2 h-2 rounded-full bg-neutral"></span><span id="anki-text" class="text-xs">检查 Anki 连接…</span></div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <!-- 生成区 -->
    <div class="card bg-base-100 shadow-sm border border-base-200 stagger">
      <div class="card-body gap-3">
        <h2 class="card-title text-base"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>生成卡片</h2>
        <div class="border border-dashed border-base-300 rounded-2xl p-5 text-center cursor-pointer hover:border-teal-600 transition-colors" id="drop">
          <input type="file" id="file" multiple accept=".pdf,.pptx,.docx,.xlsx,.md,.markdown,.txt" class="hidden">
          <svg class="icon icon-lg mx-auto mb-1 opacity-70" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
          <div class="text-sm"><b>拖拽文件</b>或点击选择</div>
          <div class="text-xs opacity-60 mt-0.5">PDF 文字层 / PPTX / DOCX / XLSX / MD / TXT · 多选</div>
        </div>
        <div id="files" class="flex flex-col gap-2"></div>
        <label class="label text-sm pt-1">目标牌组（:: 分级）</label>
        <input type="text" id="deck" placeholder="考研::政治" class="input input-bordered w-full">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="label text-sm">每节最多卡片</label><input type="number" id="maxcards" value="10" min="1" max="50" class="input input-bordered w-full"></div>
          <div><label class="label text-sm">并发数</label><input type="number" id="conc" value="4" min="1" max="12" class="input input-bordered w-full"></div>
        </div>
        <details class="collapse collapse-arrow bg-base-200 rounded-xl">
          <summary class="collapse-title text-sm font-semibold py-2 min-h-0">高级选项（引擎 / 模型 / 样式）</summary>
          <div class="collapse-content text-sm">
            <label class="label text-sm pt-0">生成引擎</label>
            <div class="grid grid-cols-2 bg-base-100 border border-base-300 rounded-xl p-1 gap-1" id="engine">
              <button data-v="llm" class="btn btn-sm border-0 bg-teal-600 text-white hover:bg-teal-700">AI 生成</button>
              <button data-v="local" class="btn btn-sm btn-ghost">本地规则引擎（免 Key）</button>
            </div>
            <div id="llmfields" class="mt-2">
              <div class="grid grid-cols-2 gap-3">
                <div><label class="label text-sm">服务商</label><select id="provider" class="select select-bordered w-full select-sm"></select></div>
                <div><label class="label text-sm">模型</label><input type="text" id="model" placeholder="deepseek-chat" class="input input-bordered w-full input-sm"></div>
              </div>
              <label class="label text-sm">API Key</label>
              <input type="password" id="key" placeholder="仅本次使用" class="input input-bordered w-full input-sm">
            </div>
            <label class="label text-sm pt-1">卡片样式</label>
            <div class="grid grid-cols-3 bg-base-100 border border-base-300 rounded-xl p-1 gap-1" id="style">
              <button data-v="basic" class="btn btn-sm border-0 bg-teal-600 text-white hover:bg-teal-700">问答</button>
              <button data-v="cloze" class="btn btn-sm btn-ghost">填空</button>
              <button data-v="vocab" class="btn btn-sm btn-ghost">单词</button>
            </div>
          </div>
        </details>
        <button class="btn border-0 bg-teal-600 text-white hover:bg-teal-700 sheen" id="go">
          <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>生成卡片
        </button>
        <div id="genmsg"></div>
      </div>
    </div>

    <!-- 学习区 -->
    <div class="card bg-base-100 shadow-sm border border-base-200 stagger" style="animation-delay:.08s">
      <div class="card-body gap-3">
        <h2 class="card-title text-base"><svg class="icon" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>学习模式</h2>
        <div id="study-home">
          <p class="text-sm opacity-70">生成过的牌组会出现在这里。用 FSRS 间隔重复算法安排复习——在浏览器里直接刷卡，进度自动保存。</p>
          <label class="label text-sm pt-2">牌组名</label>
          <input type="text" id="study-deck" placeholder="与生成时的牌组名一致" class="input input-bordered w-full">
          <button class="btn btn-outline w-full mt-2 border-teal-600 text-teal-700 hover:bg-teal-600 hover:text-white" id="study-open">
            <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>打开学习队列
          </button>
          <div id="study-meta"></div>
        </div>
        <div id="study-session" class="hidden"></div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
// 深色跟随系统：学习工具白天浅色护眼、夜间深色省力
const applyTheme = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'corporate';
  document.querySelector('meta[name=theme-color]').content = dark ? '#0b0f19' : '#f8fafc';
};
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
let FILES = [];
let STYLE = 'basic';
let ENGINE = 'llm';
let JOB = null;
let POLL = null;
let STUDY = null; // {deck, queue, index}

// ---------- icons ----------
const I = {
  check: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  x: '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  minus: '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  star: '<svg class="icon" viewBox="0 0 24 24"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>',
  brain: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/></svg>',
  file: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  zap: '<svg class="icon" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
  book: '<svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
};

fetch('/api/providers').then(r => r.json()).then(p => {
  $('provider').innerHTML = Object.entries(p).map(([k, v]) =>
    '<option value="' + k + '">' + k + '（' + v.hint + '）</option>').join('');
  $('provider').onchange = () => { $('model').value = p[$('provider').value].hint; };
  $('provider').onchange();
});

fetch('/api/check').then(r => r.json()).then(c => {
  $('anki-dot').className = 'inline-block w-2 h-2 rounded-full ' + (c.ok ? 'bg-success' : 'bg-error');
  $('anki-text').textContent = c.ok ? 'Anki 已连接（v' + c.version + '）' : 'Anki 未运行 — 可用 .apkg 导入';
});

// ---------- files ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('border-teal-600', 'bg-teal-50'); };
drop.ondragleave = () => drop.classList.remove('border-teal-600', 'bg-teal-50');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('border-teal-600', 'bg-teal-50'); addFiles(e.dataTransfer.files); };
$('file').onchange = (e) => addFiles(e.target.files);
function addFiles(list) {
  for (const f of list) {
    const r = new FileReader();
    r.onload = () => { FILES.push({ name: f.name, dataBase64: r.result.split(',')[1], bytes: f.size }); renderFiles(); };
    r.readAsDataURL(f);
  }
}
function renderFiles() {
  $('files').innerHTML = FILES.map((f, i) =>
    '<div class="flex justify-between items-center bg-base-200 rounded-xl px-3 py-2 text-sm">' +
    '<span class="flex items-center gap-2">' + I.file + esc(f.name) + '</span>' +
    '<span class="opacity-60 text-xs">' + (f.bytes/1024).toFixed(0) + ' KB <a href="#" onclick="FILES.splice(' + i + ',1);renderFiles();return false" class="text-error">✕</a></span></div>').join('');
}

// ---------- segments ----------
$('engine').onclick = (e) => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  ENGINE = b.dataset.v;
  for (const x of $('engine').children) { x.classList.toggle('bg-teal-600', x === b); x.classList.toggle('text-white', x === b); x.classList.toggle('btn-ghost', x !== b); }
  $('llmfields').style.display = ENGINE === 'local' ? 'none' : 'block';
};
$('style').onclick = (e) => {
  const b = e.target.closest('[data-v]'); if (!b) return;
  STYLE = b.dataset.v;
  for (const x of $('style').children) { x.classList.toggle('bg-teal-600', x === b); x.classList.toggle('text-white', x === b); x.classList.toggle('btn-ghost', x !== b); }
};

// ---------- generate ----------
$('go').onclick = async () => {
  if (FILES.length === 0) return gmsg('请先选择至少一个文件', true);
  const deck = $('deck').value.trim() || 'Imported';
  if (ENGINE === 'llm' && !$('key').value.trim()) return gmsg('请填写 API Key（高级选项里也可切换本地引擎，免 Key）', true);
  $('go').disabled = true;
  gmsg('');
  try {
    let last = null;
    for (const f of FILES) {
      const res = await fetch('/api/generate', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          name: f.name, dataBase64: f.dataBase64, deck, engine: ENGINE,
          provider: $('provider').value, model: $('model').value.trim(),
          apiKey: $('key').value.trim(), style: STYLE,
          maxCards: +$('maxcards').value, concurrency: +$('conc').value,
        }) });
      const j = await res.json();
      if (j.error) throw new Error(j.error);
      last = j;
    }
    JOB = last;
    POLL = setInterval(poll, 900);
  } catch (e) { gmsg(e.message, true); $('go').disabled = false; }
};

async function poll() {
  if (!JOB) return;
  const j = await (await fetch('/api/job/' + JOB.id)).json();
  const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
  gmsg('生成中 ' + pct + '%…');
  if (j.status === 'error') { clearInterval(POLL); $('go').disabled = false; return gmsg(j.error, true); }
  if (j.status !== 'done') return;
  clearInterval(POLL);
  $('go').disabled = false;
  const failed = (j.perChunk || []).filter(c => c.error).length;
  gmsg('完成：' + j.cards.length + ' 张卡片（' + j.done + '/' + j.total + ' 节' + (failed ? '，' + failed + ' 节失败' : '') + '）。点击卡片翻面；学习进度已就绪。');
  // 学习入口高亮
  $('study-deck').value = $('deck').value.trim();
  $('study-home').querySelector('p').innerHTML = '<b class="text-teal-700">' + j.cards.length + ' 张新卡片已进入学习队列。</b>输入牌组名（已自动填入）并打开学习队列开始刷卡。';
}

function gmsg(m, isErr) {
  $('genmsg').innerHTML = m
    ? '<div class="alert ' + (isErr ? 'alert-error' : 'alert-success') + ' text-sm py-2">' + esc(m) + '</div>'
    : '<div class="skeleton h-6 w-full"></div>';
}

// ---------- study mode ----------
$('study-open').onclick = async () => {
  const deck = $('study-deck').value.trim();
  if (!deck) return;
  const q = await (await fetch('/api/study/queue?deck=' + encodeURIComponent(deck))).json();
  if (q.error) return studyMsg(q.error);
  STUDY = { deck, queue: q.queue, index: 0, done: 0, again: 0 };
  renderStudy();
};

function renderStudy() {
  const remaining = STUDY.queue.length - STUDY.index;
  $('study-session').classList.remove('hidden');
  $('study-home').classList.add('hidden');
  if (STUDY.index >= STUDY.queue.length) {
    $('study-session').innerHTML =
      '<div class="text-center py-8 pop">' + I.brain +
      '<div class="text-2xl font-bold mt-3">本轮完成</div>' +
      '<div class="text-sm opacity-70 mt-1">复习 ' + STUDY.done + ' 张（其中标忘 ' + STUDY.again + ' 张）<br>到期卡片会再次出现在队列里。</div>' +
      '<button class="btn btn-outline border-teal-600 text-teal-700 mt-4" onclick="location.reload()">刷新队列</button></div>';
    return;
  }
  const c = STUDY.queue[STUDY.index];
  $('study-session').innerHTML =
    '<div class="flex justify-between text-xs opacity-70 mb-2"><span>第 ' + (STUDY.index + 1) + ' / ' + STUDY.queue.length + ' 张</span><span>剩余 ' + remaining + '</span></div>' +
    '<div class="card bg-base-200/60 border border-base-300"><div class="card-body p-5 min-h-40 items-center justify-center text-center">' +
    '<div class="text-[10px] font-bold tracking-widest text-teal-700 mb-1">' + (c.state === 0 ? '新卡片' : '复习') + '</div>' +
    '<div id="card-front" class="text-lg font-semibold fade-in cursor-pointer" title="点击翻面" onclick="$(\'card-back\').classList.remove(\'hidden\');$(\'card-front\').classList.add(\'hidden\');$(\'gradebar\').classList.remove(\'hidden\')">' + esc(c.front) + '</div>' +
    '<div id="card-back" class="hidden"><div class="text-base leading-relaxed">' + esc(c.back || '（无补充）') + '</div>' +
    (c.source ? '<div class="text-xs opacity-60 mt-2">📍 ' + esc(c.source) + '</div>' : '') + '</div></div></div>' +
    '<div id="gradebar" class="hidden grid grid-cols-4 gap-2 mt-3 pop">' +
    '<button class="btn btn-sm flex-col h-auto py-2 border-error/40 text-error hover:bg-error hover:text-white" onclick="grade(1)">' + I.x + '<span class="text-[10px]">忘记</span></button>' +
    '<button class="btn btn-sm flex-col h-auto py-2 border-warning/40 text-warning hover:bg-warning hover:text-white" onclick="grade(2)">' + I.minus + '<span class="text-[10px]">困难</span></button>' +
    '<button class="btn btn-sm flex-col h-auto py-2 border-success/40 text-success hover:bg-success hover:text-white" onclick="grade(3)">' + I.check + '<span class="text-[10px]">良好</span></button>' +
    '<button class="btn btn-sm flex-col h-auto py-2 border-info/40 text-info hover:bg-info hover:text-white" onclick="grade(4)">' + I.star + '<span class="text-[10px]">简单</span></button>' +
    '</div>' +
    '<div class="hint text-xs opacity-60 mt-2">键盘党：空格翻面，1/2/3/4 评分。FSRS 会据此安排下次复习时间。</div>' +
    '<div id="study-msg"></div>';
}

async function grade(rating) {
  const c = STUDY.queue[STUDY.index];
  if (rating === 1) STUDY.again++;
  STUDY.done++; STUDY.index++;
  renderStudy();
  try {
    await fetch('/api/study/review', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ deck: STUDY.deck, front: c.front, rating }) });
  } catch (e) { /* progress already advanced in UI; persistence retried next review */ }
}

function studyMsg(m) { $('study-meta').innerHTML = '<div class="alert alert-error text-sm py-2 mt-2">' + esc(m) + '</div>'; }

// ---------- export (kept from before) ----------
async function download(fmt) {
  const r = await fetch('/api/export', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ jobId: JOB.id, format: fmt }) });
  if (!r.ok) return;
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = ($('deck').value.trim() || 'anki-forge') + (fmt === 'apkg' ? '.apkg' : '.txt');
  a.click();
  URL.revokeObjectURL(a.href);
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 学习快捷键：空格翻面、1-4 评分——刷卡效率的核心
document.addEventListener('keydown', (e) => {
  const sess = document.getElementById('study-session');
  if (!sess || sess.classList.contains('hidden')) return;
  const back = document.getElementById('card-back');
  if (e.code === 'Space' && back && back.classList.contains('hidden')) {
    e.preventDefault();
    document.getElementById('card-front').classList.add('hidden');
    back.classList.remove('hidden');
    document.getElementById('gradebar').classList.remove('hidden');
    return;
  }
  if (['1', '2', '3', '4'].includes(e.key) && back && !back.classList.contains('hidden')) {
    e.preventDefault();
    grade(Number(e.key));
  }
});
// 学习卡滑动评分（与 demo 同款 pointer 手势）：答案未翻出时左右滑打分
(function attachSwipe() {
  const card = $('ocard');
  let startX = null, dx = 0;
  card.addEventListener('pointerdown', (e) => {
    if ($('oback-side').style.display === 'block') return;
    startX = e.clientX; dx = 0; card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e) => {
    if (startX === null) return;
    dx = e.clientX - startX;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.04 + 'deg)';
  });
  card.addEventListener('pointerup', (e) => {
    if (startX === null) return;
    card.style.transition = 'transform .25s';
    if (Math.abs(dx) > 90) {
      const dir = dx > 0 ? 1 : -1;
      card.style.transform = 'translateX(' + dir * 480 + 'px) rotate(' + dir * 22 + 'deg)';
      setTimeout(() => { card.style.transform = ''; grade(dir > 0 ? 3 : 1); }, 160);
    } else {
      card.style.transform = '';
    }
    startX = null;
  });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
