name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test

      - name: CLI help and usage errors exit cleanly
        run: |
          node src/cli.mjs --help
          node src/cli.mjs
          if node src/cli.mjs import; then
            echo "::error::import without --deck must fail"
            exit 1
          fi
