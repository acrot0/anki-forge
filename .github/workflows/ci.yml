name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test

      - name: CLI help prints and usage errors exit non-zero
        # shell: bash is load-bearing: the default on Windows is pwsh, which
        # cannot parse this script at all.
        shell: bash
        run: |
          node src/cli.mjs --help > /dev/null
          if node src/cli.mjs import 2> /dev/null; then
            echo "::error::import without --deck must fail"
            exit 1
          fi
