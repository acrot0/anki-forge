<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>anki-forge — 讲义变卡组</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
<meta name="theme-color" content="#f8fafc">
<style>
  :root {
    --bg: #0f1122; --card: #181b39; --ink: #eef0f8; --sub: #9aa3c0; --faint: #6a7194;
    --line: rgba(170,160,247,.16); --teal: #21a582; --teal-d: #2ec4a0; --teal-bg: rgba(33,165,130,.14);
    --err: #fd5f6c;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--card);
         box-shadow: 0 0 0 1px var(--line), 0 4px 24px rgba(16,24,40,.05); }
  @media (min-width: 560px) { .app { margin-top: 20px; border-radius: 18px; } }
  .appbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px); z-index: 20; box-shadow: 0 1px 8px rgba(16,24,40,.04);
  }
  .appbar .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15.5px; }
  .appbar .brand svg { width: 20px; height: 20px; stroke: var(--teal); fill: none; }
  .appbar a { font-size: 12.5px; color: var(--teal); text-decoration: none; font-weight: 600; }
  .body { padding: 14px 14px 40px; }

  .sec-label { font-size: 12px; font-weight: 700; color: var(--faint); letter-spacing: .6px; margin: 16px 0 8px; }
  textarea {
    width: 100%; min-height: 110px; border: 1.5px solid var(--line); border-radius: 12px;
    padding: 11px 13px; font-size: 13.5px; line-height: 1.6; font-family: inherit; resize: vertical;
    background: rgba(24,27,57,.5); color: var(--ink); outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: var(--teal); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--sub); cursor: pointer;
          font-size: 12.5px; padding: 7px 12px; border-radius: 99px; transition: all .15s; }
  .chip:active { transform: scale(.96); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
    border: 0; cursor: pointer; font-size: 14.5px; font-weight: 650; color: #fff; min-height: 46px;
    background: linear-gradient(135deg, #21a582, #178a6e); box-shadow: 0 2px 12px rgba(33,165,130,.3); border-radius: 12px; margin-top: 12px; box-shadow: 0 2px 10px rgba(13,148,136,.25); transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: rgba(33,165,130,.14); color: #2ec4a0; width: auto; min-height: 38px; font-size: 13px; margin: 0; padding: 8px 16px; }

  .msg { margin: 10px 0 0; font-size: 13px; padding: 9px 12px; border-radius: 10px; display: none; }
  .msg.err { display: block; background: #fef2f2; color: var(--err); }
  .msg.ok { display: block; background: var(--teal-bg); color: var(--teal-d); }

  .search { position: relative; margin-top: 10px; }
  .search input { width: 100%; border: 1.5px solid var(--line); border-radius: 11px; padding: 9px 12px 9px 36px;
    font-size: 13.5px; background: rgba(24,27,57,.5); color: var(--ink); outline: none; }
  .search input:focus { border-color: var(--teal); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2; }
  .clist { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .citem { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); transition: border-color .15s, box-shadow .15s; }
  .citem:hover { border-color: rgba(170,160,247,.45); background: rgb(32,35,73); box-shadow: 0 2px 12px rgba(0,0,0,.3); }
  .citem .qrow { display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; cursor: pointer; }
  .citem .qnum { flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; background: var(--teal-bg);
    color: var(--teal-d); font-size: 11px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
  .citem .qtext { font-size: 13.5px; font-weight: 600; line-height: 1.5; flex: 1; }
  .citem .atext { padding: 9px 12px 11px 40px; font-size: 13px; line-height: 1.6; color: var(--sub);
    border-top: 1px dashed var(--line); display: none; }
  .citem.open .atext { display: block; animation: fade .25s both; }
  .citem .src { font-size: 11px; color: var(--faint); margin-top: 4px; }
  .citem.match-none { display: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  .count-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .count-row span { font-size: 12.5px; color: var(--sub); }
  .empty { text-align: center; padding: 30px 10px; color: var(--faint); font-size: 13px; }
  .hidden { display: none; }
  #filechip { display: flex; align-items: center; gap: 8px; background: var(--teal-bg); border: 1px solid rgba(13,148,136,.3);
    border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--teal-d); margin-top: 8px; }
  #filechip .x { margin-left: auto; cursor: pointer; color: var(--err); font-weight: 700; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; }
  .overlay.on { display: flex; }
  .obar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .obar .x { border: 0; background: none; font-size: 15px; cursor: pointer; color: var(--sub); padding: 4px 8px; }
  .obar .prog { flex: 1; height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .obar .prog i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 99px; transition: width .3s; }
  .obar .cnt { font-size: 12px; color: var(--sub); }
  .ocard-area { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 16px; }
  .ocard { background: var(--card); border: 1px solid rgba(170,160,247,.18); border-radius: 16px; padding: 22px 18px;
    min-height: 210px; display: flex; flex-direction: column; box-shadow: 0 2px 14px rgba(16,24,40,.06);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .ocard .tagline { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--teal); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; }
  .ocard .qbig { font-size: 18px; font-weight: 650; line-height: 1.55; text-align: center; margin: auto 0; }
  .ocard .abig { font-size: 15.5px; line-height: 1.65; color: var(--ink); }
  .ocard .qkeep { font-size: 13px; font-weight: 600; color: var(--sub); border-bottom: 1px dashed var(--line);
    padding-bottom: 10px; margin-bottom: 12px; line-height: 1.5; }
  .ocard .src { font-size: 11.5px; color: var(--faint); margin-top: 12px; }
  .ocard .speak-btn { border: 1px solid var(--line); background: var(--card); border-radius: 99px; width: 34px; height: 34px;
    display: grid; place-items: center; cursor: pointer; }
  .grades { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); }
  .grades button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 0;
    font-size: 13px; font-weight: 650; cursor: pointer; color: var(--ink); }
  .grades button small { display: block; font-size: 10.5px; font-weight: 400; color: var(--faint); margin-top: 2px; }
  .grades .g1 { border-color: #fecaca; } .grades .g1:active { background: #fef2f2; }
  .grades .g2 { border-color: #fde68a; } .grades .g2:active { background: #fffbeb; }
  .grades .g3 { border-color: #99f6e4; } .grades .g3:active { background: var(--teal-bg); }
  .grades .g4 { border-color: #bfdbfe; } .grades .g4:active { background: #eff6ff; }
  .swipe-hint { text-align: center; font-size: 11.5px; color: var(--faint); padding-bottom: 10px; }
  .done-box { text-align: center; padding: 40px 20px; }
  .done-box .big { font-size: 22px; font-weight: 750; color: var(--teal); }
  .done-box .sub { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.7; }
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M9 7h7"/></svg>
      anki-forge
    </div>
    <a href="https://github.com/acrot0/anki-forge" target="_blank">PC 版下载</a>
  </div>

  <div class="body">
      <div class="sec-label">导入材料（Word / TXT / MD / 粘贴文本，本地处理）</div>
    <input type="file" id="fileinput" accept=".docx,.md,.markdown,.txt" class="hidden">
    <button class="btn secondary" id="filebtn" style="margin-top:0">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
      选择文件（Word / TXT / MD）
    </button>
    <div id="filechip" style="display:none"></div>
    <textarea id="text" placeholder="…或直接粘贴讲义文本。支持句式：X 是 Y / X 包括 A、B / A 导致 B / 数字年代事实"></textarea>
    <div class="chips" id="demos">
      <button class="chip" data-demo="words">考研英语词表</button>
      <button class="chip" data-demo="bio">生物·细胞</button>
      <button class="chip" data-demo="hist">中国近代史</button>
      <button class="chip" data-demo="cs">计算机网络</button>
      <button class="chip" data-demo="med">医学·免疫</button>
    </div>
    <button class="btn" id="go">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      生成卡片
    </button>
    <div class="msg" id="msg"></div>

    <div id="listwrap" style="display:none">
      <div class="sec-label" style="margin-top:20px">卡片列表</div>
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="搜索问题或答案…">
      </div>
      <div class="count-row"><span id="count"></span><button class="btn secondary" id="study-go">▶ 开始学习</button></div>
      <div class="clist" id="clist"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="obar">
    <button class="x" id="ox">✕</button>
    <div class="prog"><i id="oprogress"></i></div>
    <span class="cnt" id="ocount"></span>
  </div>
  <div class="ocard-area">
    <div class="ocard" id="ocard">
      <div id="ofront-side">
        <div class="tagline"><span id="otag">新卡片</span><span id="ospeak" style="display:none;cursor:pointer" title="发音">🔊</span></div>
        <div class="qbig" id="oq"></div>
      </div>
      <div id="oback-side" style="display:none">
        <div class="qkeep" id="oqkeep"></div>
        <div class="abig" id="oa"></div>
        <div class="src" id="osrc"></div>
      </div>
    </div>
    <div class="swipe-hint" id="ohint">← 左滑标忘 · 右滑记住 · 点卡片翻面 →</div>
    <div class="grades" id="grades">
      <button class="g1" onclick="grade(1)">忘记<small>1</small></button>
      <button class="g2" onclick="grade(2)">困难<small>2</small></button>
      <button class="g3" onclick="grade(3)">良好<small>3</small></button>
      <button class="g4" onclick="grade(4)">简单<small>4</small></button>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let CARDS = [];
let FSRS_LIB = null;
import('https://cdn.jsdelivr.net/npm/ts-fsrs@5/+esm').then(m => { FSRS_LIB = m; }).catch(() => {});
const LS_KEY = 'anki-forge-demo-progress';
function loadProgress() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function saveProgress(p) { try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch {} }
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'k' + Math.abs(h).toString(36); }

const DEMOS = {
  words: [
    ['abandon', 'v. 放弃，抛弃', 'He was forced to abandon the plan.'],
    ['abundant', 'adj. 丰富的，充裕的', 'The region has abundant natural resources.'],
    ['accelerate', 'v. 加速，促进', 'Stress can accelerate the aging process.'],
    ['alleviate', 'v. 减轻，缓解', 'The medicine alleviated his pain quickly.'],
    ['ambiguous', 'adj. 模棱两可的', 'His answer was deliberately ambiguous.'],
    ['anticipate', 'v. 预期，预料', 'We anticipate strong opposition to the plan.'],
    ['compensate', 'v. 补偿，弥补', 'Nothing can compensate for the loss of time.'],
    ['crucial', 'adj. 至关重要的', 'Reading plays a crucial role in learning.'],
    ['deteriorate', 'v. 恶化，变坏', 'His health deteriorated rapidly last winter.'],
    ['facilitate', 'v. 促进，使便利', 'The new system facilitates online learning.'],
  ],
  bio: '线粒体是细胞进行有氧呼吸的主要场所，被称为细胞的动力车间。\n叶绿体是绿色植物进行光合作用的场所。\n细胞器包括线粒体、内质网、核糖体、高尔基体和溶酶体。\n糖类是生物体的主要能源物质。DNA 携带着生物体的遗传信息。\n蛋白质是生命活动的主要承担者，其基本组成单位是氨基酸。',
  hist: '鸦片战争是 1840 年爆发的近代史开端事件。《南京条约》是中国近代史上第一个不平等条约。\n洋务运动是一场自上而下的自救运动。甲午战争战败标志着洋务运动的破产。\n辛亥革命推翻了清王朝的统治。五四运动是一场彻底的反帝反封建爱国运动。\n1921 年是中国共产党成立的时间。遵义会议是党的历史上生死攸关的转折点。',
  cs: 'TCP 是一种面向连接的可靠传输协议。UDP 是一种无连接的不可靠传输协议。\nHTTP 的常见状态码包括 200、301、404 和 500。\nDNS 的作用是将域名解析为 IP 地址。\n三次握手是 TCP 建立连接的过程。包丢失会导致数据传输不完整。\nHTTPS 是在 HTTP 基础上加入 TLS 加密层的协议。',
  med: '免疫系统是人体抵御病原体的防御体系。抗原是指能够触发免疫应答的物质。\n抗体包括 IgG、IgA、IgM、IgE 和 IgD 五类。\n炎症反应会导致局部红肿热痛。疫苗通过诱导机体产生抗体和记忆细胞来提供保护。\n过敏反应是免疫系统对无害物质的过度应答。',
};
// ---- 文件导入（Word / TXT / MD）----
function decodeXmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function parseDocxBrowser(arrayBuf) {
  const zip = fflate.unzipSync(new Uint8Array(arrayBuf));
  const xmlEntry = Object.keys(zip).find((k) => k === 'word/document.xml');
  if (!xmlEntry) throw new Error('不是有效的 .docx 文件（缺少 word/document.xml）');
  const xml = new TextDecoder().decode(zip[xmlEntry]);
  const paras = [...xml.matchAll(/<w:p[ >]([\s\S]*?)<\/w:p>/g)]
    .map((m) => [...m[1].matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)]
      .map((t) => decodeXmlEntities(t[1].replace(/\s+/g, ' '))).join(''))
    .map((p) => p.trim()).filter(Boolean);
  if (paras.join('').length < 20) throw new Error('Word 文档几乎没有文字——扫描图片需要 OCR，本页不支持');
  return paras.join('\n');
}
$('filebtn').onclick = () => $('fileinput').click();
$('fileinput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    let text;
    if (/\.docx$/i.test(f.name)) {
      text = parseDocxBrowser(await f.arrayBuffer());
    } else {
      text = await f.text();
    }
    if (!text.trim()) throw new Error('文件内容为空');
    $('text').value = text;
    $('filechip').style.display = 'flex';
    $('filechip').innerHTML = '<span>📄 ' + esc(f.name) + '（' + (f.size / 1024).toFixed(0) + ' KB）— 已载入，点生成</span><span class="x" onclick="clearFile()">✕</span>';
    generate();
  } catch (err) {
    $('filechip').style.display = 'flex';
    $('filechip').innerHTML = '<span style="color:var(--err)">' + esc(err.message) + '</span>';
  }
};
function clearFile() {
  $('fileinput').value = '';
  $('filechip').style.display = 'none';
  $('text').value = '';
}
$('demos').onclick = (e) => {
  const d = e.target.dataset.demo; if (!d) return;
  if (d === 'words') {
    $('text').value = DEMOS.words.map(([w, def, ex]) => w + ' ' + def + '。例：' + ex).join('\n');
  } else {
    $('text').value = DEMOS[d];
  }
  generate();
};

function sentences(text) {
  return text.replace(/([。！？!?；;])\s*/g, '$1\n').split(/\n+/)
    .map((s) => s.replace(/^[\s•·\-*\d]+[.、)\]]*\s*/, '').trim()).filter((s) => s.length >= 7);
}
function stripModal(x) { return x.replace(/(?:会|将|可能|能)$/, '') || x; }
function rules() {
  return [
    { re: /^(.{2,40}?)(?:是指|指的是|就是|是|称为|叫做)(.{4,160})[。．；;]?$/, make: (m) => ({ front: '什么是' + m[1].trim() + '？', back: m[2].trim() }) },
    { re: /^(.{2,30}?)(?:包括|分为|包含|有以下|可分成)(.{4,180})[。；;]?$/, make: (m) => ({ front: m[1].trim() + '包括哪些内容？', back: m[2].trim() }) },
    { re: /^(.{3,50}?)(?:导致|引起|造成|使得|促使)(.{4,140})[。．；;]?$/, make: (m) => ({ front: stripModal(m[1].trim()) + '会导致什么？', back: m[2].trim() }) },
    { re: /^(.{2,36}?)(?:是|为|达到|约|大约|共)(\s*(?:公元)?\d[\d,.]*\s*(?:年|个|%|％|倍|千米|公里|米|克|千克|万吨|亿))[^。；]{0,60}[。；;]?$/, make: (m) => ({ front: m[1].trim() + '是多少？', back: m[2].trim() }) },
    { re: /^(.{2,60}?)\s+(?:is|are|refers to|means|is defined as)\s+(.{4,200})[.;]?$/i, make: (m) => ({ front: 'What is ' + m[1].trim() + '?', back: m[2].trim() }) },
    { re: /^(.{2,40}?)\s+(?:includes|consists of|comprises|is divided into)\s+(.{4,200})[.;]?$/i, make: (m) => ({ front: 'What does ' + m[1].trim() + ' include?', back: m[2].trim() }) },
    { re: /^(.{3,60}?)\s+(?:causes|leads to|results in)\s+(.{4,180})[.;]?$/i, make: (m) => ({ front: 'What does ' + m[1].trim() + ' lead to?', back: m[2].trim() }) },
  ];
}
function extractCards(text, cap) {
  const out = []; const seen = new Set();
  for (const s of sentences(text)) {
    if (out.length >= cap) break;
    for (const r of rules()) {
      const m = s.match(r.re);
      if (!m) continue;
      let c; try { c = r.make(m); } catch { continue; }
      if (!c.front || !c.back || c.front.length < 4 || c.front.length > 80 || c.back.length < 3 || c.back.length > 220) continue;
      const key = c.front.toLowerCase().replace(/\s+/g, ' ');
      if (seen.has(key)) continue;
      seen.add(key); out.push(c); break;
    }
  }
  return out;
}

function generate() {
  const text = $('text').value.trim();
  if (!text) return msg('先粘贴材料，或点上方示例', true);
  const isWords = text.split(/\n/).every((l) => l.trim() === '' || /^[a-zA-Z][\w'-]*\s/.test(l.trim()));
  CARDS = isWords
    ? text.split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
        const m = l.match(/^(\S+)\s+(.+?)(?:。\s*例：(.+?))?\.?$/);
        return m ? { front: m[1], back: (m[2] || '') + (m[3] ? '\n' + m[3] : ''), source: '' } : null;
      }).filter(Boolean)
    : extractCards(text, 60);
  if (CARDS.length === 0) return msg('没能抽出卡片——需要「X 是 Y」「X 包括…」「A 导致 B」或词表行', true);
  msg('✓ 生成 ' + CARDS.length + ' 张卡片。点击问题看答案；点「开始学习」进入复习模式。');
  $('search').value = '';
  renderList('');
  $('listwrap').style.display = 'block';
}
$('go').onclick = generate;

$('search').oninput = (e) => renderList(e.target.value.trim().toLowerCase());
function renderList(q) {
  const shown = CARDS.filter((c) => !q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q));
  $('count').textContent = '共 ' + CARDS.length + ' 张' + (q ? '，匹配 ' + shown.length + ' 张' : '');
  $('clist').innerHTML = shown.length === 0
    ? '<div class="empty">没有匹配的卡片</div>'
    : shown.map((c) => {
        const i = CARDS.indexOf(c);
        return '<div class="citem" data-i="' + i + '">' +
          '<div class="qrow" onclick="this.parentElement.classList.toggle(\'open\')">' +
          '<div class="qnum">' + (i + 1) + '</div><div class="qtext">' + esc(c.front) + '</div></div>' +
          '<div class="atext">' + esc(c.back).replace(/\n/g, '<br>') +
          (c.source ? '<div class="src">📍 ' + esc(c.source) + '</div>' : '') + '</div></div>';
      }).join('');
}

let STUDY = null;
$('study-go').onclick = () => {
  if (CARDS.length === 0) return;
  const progress = loadProgress();
  const now = Date.now();
  STUDY = {
    deck: '体验牌组',
    cards: CARDS.map((c) => {
      const key = hash(c.front);
      const saved = progress[key];
      return { ...c, key, due: saved ? saved.due : 0, state: saved ? saved.state : 0, reps: saved ? saved.reps : 0 };
    }),
    queue: [], index: 0, done: 0, again: 0,
  };
  STUDY.queue = STUDY.cards.filter((c) => c.due <= now).sort((a, b) => a.due - b.due);
  if (STUDY.queue.length === 0) STUDY.queue = [...STUDY.cards].sort((a, b) => a.due - b.due).slice(0, 10);
  $('overlay').classList.add('on');
  renderStudy();
};

function renderStudy() {
  if (STUDY.index >= STUDY.queue.length) {
    const acc = STUDY.done ? Math.round((STUDY.done - STUDY.again) / STUDY.done * 100) : 100;
    $('ocard').innerHTML = '<div class="done-box"><div class="big">本轮完成</div>' +
      '<div class="sub">复习 ' + STUDY.done + ' 张 · 标忘 ' + STUDY.again + ' 张 · 正确率 ' + acc + '%<br>标忘的卡会更快回来。进度已保存。</div></div>';
    $('grades').style.display = 'none';
    $('ohint').textContent = '退出后可再次「开始学习」继续。';
    $('ocount').textContent = '';
    return;
  }
  const c = STUDY.queue[STUDY.index];
  $('ofront-side').style.display = 'block';
  $('oback-side').style.display = 'none';
  $('grades').style.display = 'none';
  $('ohint').style.display = 'block';
  $('otag').textContent = c.state === 0 ? '新卡片' : '复习 · 第 ' + (c.reps + 1) + ' 次';
  $('oq').textContent = c.front;
  $('oqkeep').textContent = c.front;
  $('oa').textContent = c.back || '（无补充）';
  $('osrc').textContent = c.source ? '📍 ' + c.source : '';
  $('ospeak').style.display = /[a-zA-Z]{3,}/.test(c.front) ? 'inline-block' : 'none';
  $('ocard').style.transform = '';
  $('oprogress').style.width = Math.round(STUDY.index / STUDY.queue.length * 100) + '%';
  $('ocount').textContent = (STUDY.index + 1) + '/' + STUDY.queue.length;
}
function showBack() {
  $('ofront-side').style.display = 'none';
  $('oback-side').style.display = 'block';
  $('grades').style.display = 'grid';
  $('ohint').style.display = 'none';
}
$('ocard').onclick = () => {
  if ($('oback-side').style.display !== 'block') showBack();
};
$('ospeak').onclick = (e) => { e.stopPropagation(); speak($('oq').textContent); };

async function grade(rating) {
  const c = STUDY.queue[STUDY.index];
  if (rating === 1) STUDY.again++;
  STUDY.done++; STUDY.index++;
  const progress = loadProgress();
  const entry = progress[c.key] || { state: 0, due: 0, reps: 0 };
  entry.reps++;
  if (FSRS_LIB) {
    try {
      const { fsrs, generatorParameters, createEmptyCard } = FSRS_LIB;
      const sched = fsrs(generatorParameters({ enable_fuzz: true }));
      const fsrsCard = entry.fsrsCard || createEmptyCard(new Date());
      const next = sched.next(fsrsCard, new Date(), rating);
      entry.fsrsCard = { due: next.card.due.toISOString(), stability: next.card.stability, state: next.card.state };
      entry.due = next.card.due.getTime();
      entry.state = next.card.state;
    } catch { entry.due = Date.now() + (rating === 1 ? 60000 : rating === 2 ? 21600000 : 86400000); }
  } else {
    entry.due = Date.now() + (rating === 1 ? 60000 : rating === 2 ? 21600000 : 86400000);
  }
  progress[c.key] = entry;
  saveProgress(progress);
  renderStudy();
}

(function attachSwipe() {
  const card = $('ocard');
  let startX = null, dx = 0;
  card.addEventListener('pointerdown', (e) => {
    if ($('oback-side').style.display === 'block') return;
    startX = e.clientX; dx = 0; card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e) => {
    if (startX === null) return;
    dx = e.clientX - startX;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.05 + 'deg)';
  });
  card.addEventListener('pointerup', (e) => {
    if (startX === null) return;
    card.style.transition = 'transform .25s';
    if (Math.abs(dx) > 90) {
      const dir = dx > 0 ? 1 : -1;
      card.style.transform = 'translateX(' + dir * 480 + 'px) rotate(' + dir * 25 + 'deg)';
      setTimeout(() => { card.style.transform = ''; grade(dir > 0 ? 3 : 1); }, 180);
    } else {
      card.style.transform = '';
    }
    startX = null;
  });
})();

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text || '');
    u.lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-CN' : 'en-US';
    u.rate = 0.92;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}
$('ox').onclick = () => { $('overlay').classList.remove('on'); renderList($('search').value.trim().toLowerCase()); };

function msg(m, isErr) {
  $('msg').innerHTML = '<div class="' + (isErr ? 'msg err' : 'msg ok') + '" style="display:block">' + esc(m) + '</div>';
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.addEventListener('keydown', (e) => {
  if (!$('overlay').classList.contains('on')) return;
  if (e.code === 'Space' && $('oback-side').style.display !== 'block') { e.preventDefault(); showBack(); }
  if (['1', '2', '3', '4'].includes(e.key) && $('oback-side').style.display === 'block') { e.preventDefault(); grade(Number(e.key)); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
