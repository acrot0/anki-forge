<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>anki-forge — 讲义变卡组</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<style>
  /* shadcn/ui zinc token + indigo 单一强调：精确字号/间距/圆角层级 */
  :root {
    --background: #ffffff; --foreground: #09090b;
    --muted: #fafafa; --muted-fg: #71717a;
    --border: #e4e4e7; --accent: #f4f4f5;
    --primary: #4f46e5; --primary-hover: #4338ca; --primary-fg: #ffffff;
    --ring: rgba(79,70,229,.28);
    --destructive: #dc2626;
    --radius: 10px;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
    --shadow-card: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--muted); color: var(--foreground); min-height: 100vh;
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 640px; margin: 0 auto; min-height: 100vh; background: var(--background);
         box-shadow: 0 0 0 1px var(--border), 0 8px 32px rgba(0,0,0,.06); }
  @media (min-width: 680px) { .app { margin: 28px auto; border-radius: 14px; } }

  .hd { display: flex; align-items: center; justify-content: space-between;
        padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .brand .mark { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: grid; place-items: center; }
  .brand .mark svg { width: 14px; height: 14px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .hd a { font-size: 13px; font-weight: 500; color: var(--muted-fg); text-decoration: none; padding: 6px 10px; border-radius: 8px; transition: all .15s; }
  .hd a:hover { color: var(--foreground); background: var(--accent); }

  .hero { padding: clamp(26px, 5vw, 44px) 20px clamp(20px, 4vw, 32px); text-align: center;
    background: linear-gradient(180deg, rgba(79,70,229,.05), transparent); }
  .hero h1 { font-size: clamp(24px, 5vw, 34px); font-weight: 800; letter-spacing: -.03em; line-height: 1.2; }
  .hero h1 span { background: linear-gradient(100deg, #4f46e5, #9333ea); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 12px auto 0; max-width: 460px; font-size: 14.5px; color: var(--muted-fg); line-height: 1.7; }

  .body { padding: 0 20px 48px; }
  .sec { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; margin: 18px 0 10px; }
  .sec .n { width: 22px; height: 22px; border-radius: 6px; background: var(--primary); color: var(--primary-fg);
    font-size: 11.5px; font-weight: 600; display: grid; place-items: center; }
  .sec svg { width: 15px; height: 15px; stroke: var(--muted-fg); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  textarea {
    width: 100%; min-height: 108px; border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; font-size: 13.5px; line-height: 1.6; font-family: inherit; resize: vertical;
    background: var(--background); color: var(--foreground); outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  textarea::placeholder { color: #a1a1aa; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chip { border: 1px solid var(--border); background: var(--background); color: var(--muted-fg); cursor: pointer;
          font-size: 13px; padding: 6px 12px; border-radius: 8px; transition: all .12s; font-weight: 500; }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: #eef2ff; }
  .chip:active { transform: scale(.97); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 0; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--primary-fg); min-height: 40px;
    background: var(--primary); border-radius: 8px; margin-top: 14px;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 1px 2px rgba(79,70,229,.3);
  }
  .btn:hover:not(:disabled) { background: var(--primary-hover); box-shadow: 0 4px 14px rgba(79,70,229,.3); }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.outline { background: var(--background); color: var(--foreground); border: 1px solid var(--border);
                 box-shadow: var(--shadow-xs); width: auto; font-size: 13px; min-height: 36px; padding: 0 14px; margin: 0; }
  .btn.outline:hover { background: var(--accent); box-shadow: none; }

  .msg { margin: 12px 0 0; font-size: 13px; padding: 10px 13px; border-radius: 8px; display: none;
         border: 1px solid; animation: fade .2s both; }
  .msg.err { display: block; background: #fef2f2; border-color: #fecaca; color: var(--destructive); }
  .msg.ok { display: block; background: #f0fdf4; border-color: #bbf7d0; color: #065f46; }

  .search { position: relative; margin-top: 12px; }
  .search input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px 9px 36px;
    font-size: 13.5px; background: var(--background); color: var(--foreground); outline: none; transition: border-color .15s, box-shadow .15s; }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px;
    stroke: var(--muted-fg); fill: none; stroke-width: 2; stroke-linecap: round; }

  .clist { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .citem { border: 1px solid var(--border); border-radius: 10px; background: var(--background); overflow: hidden;
    transition: border-color .15s, box-shadow .15s; }
  .citem:hover { border-color: #c7c7cf; box-shadow: var(--shadow-xs); }
  .citem .qrow { display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; }
  .citem .qnum { flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--primary); background: #eef2ff;
    border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; }
  .citem .qtext { font-size: 13.5px; font-weight: 500; line-height: 1.45; flex: 1; }
  .citem .chev { width: 15px; height: 15px; stroke: var(--muted-fg); fill: none; stroke-width: 2; transition: transform .2s; flex-shrink: 0; }
  .citem.open .chev { transform: rotate(90deg); }
  .citem .atext { padding: 11px 13px 12px 13px; font-size: 13.5px; line-height: 1.65; color: var(--foreground);
    border-top: 1px solid var(--border); background: #fafafa; display: none; }
  .citem.open .atext { display: block; animation: fade .2s both; }
  .citem.match-none { display: none; }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .count-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .count-row .cnt { font-size: 12.5px; color: var(--muted-fg); }
  .empty { text-align: center; padding: 26px 10px; color: var(--muted-fg); font-size: 13px; }
  .exports { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .fade-in { animation: fade .25s both; }

  .overlay { position: fixed; inset: 0; z-index: 50; background: var(--background); display: none; flex-direction: column; }
  .overlay.on { display: flex; }
  .obar { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .obar .x { border: 0; background: none; font-size: 14px; cursor: pointer; color: var(--muted-fg); padding: 4px 6px; }
  .obar .x:hover { color: var(--foreground); }
  .obar .prog { flex: 1; height: 4px; background: var(--muted); border-radius: 99px; overflow: hidden; }
  .obar .prog i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 99px; transition: width .25s; }
  .obar .cnt { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
  .ocard-area { flex: 1; display: flex; flex-direction: column; padding: 20px 16px; max-width: 560px; margin: 0 auto; width: 100%; }
  .ocard { flex: 1; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 14px;
    background: var(--background); padding: 24px 22px; user-select: none; -webkit-user-select: none;
    touch-action: pan-y; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
  .ocard .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .ocard .meta .tag { font-size: 11px; font-weight: 600; color: var(--primary); background: #eef2ff;
    border-radius: 5px; padding: 3px 9px; }
  .ocard .meta .speak { cursor: pointer; color: var(--muted-fg); }
  .ocard .meta .speak svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .ocard .q { font-size: 18px; font-weight: 600; line-height: 1.55; text-align: center; margin: auto 0; }
  .ocard .qkeep { font-size: 13px; font-weight: 500; color: var(--muted-fg); text-align: center;
    border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; line-height: 1.5; }
  .ocard .a { font-size: 15.5px; line-height: 1.7; color: var(--foreground); text-align: center; }
  .ocard .src { font-size: 11.5px; color: var(--muted-fg); margin-top: 12px; }
  .ocard .hint { text-align: center; font-size: 11.5px; color: #a1a1aa; margin-top: auto; padding-top: 14px; }
  .grades { display: none; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 0 4px; }
  .grades button { border: 1px solid var(--border); background: var(--background); border-radius: 8px;
    padding: 10px 0; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--foreground); transition: all .12s; }
  .grades button small { display: block; font-size: 10px; font-weight: 400; color: var(--muted-fg); margin-top: 1px; }
  .grades button:hover { transform: translateY(-1px); }
  .grades .g1 { color: var(--destructive); } .grades .g1:hover { background: #fef2f2; border-color: #fecaca; }
  .grades .g2 { color: #d97706; } .grades .g2:hover { background: #fffbeb; border-color: #fde68a; }
  .grades .g3 { color: var(--primary); } .grades .g3:hover { background: #eef2ff; border-color: #c7d2fe; }
  .grades .g4 { color: #2563eb; } .grades .g4:hover { background: #eff6ff; border-color: #bfdbfe; }
  .done-box { text-align: center; padding: 36px 16px; }
  .done-box .big { font-size: 19px; font-weight: 650; color: var(--primary); }
  .done-box .sub { font-size: 13px; color: var(--muted-fg); margin-top: 8px; line-height: 1.8; }
  .fade-in { animation: fade .25s both; }
  .slide-in { animation: slideIn .3s var(--ease, .3s) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 0 3 3h7z"/></svg></span>
      anki-forge
    </div>
    <a href="https://github.com/acrot0/anki-forge" target="_blank">GitHub</a>
  </div>

  <div class="hero">
    <h1>讲义变卡组，<span>一个粘贴的距离。</span></h1>
    <p>粘贴或导入材料，本地规则引擎立刻抽出问答卡。全程浏览器内完成——文本不经过任何服务器。</p>
  </div>

  <div class="body">
    <div class="sec"><span class="n">1</span><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>导入材料</div>
    <div class="row" style="margin-top:0">
      <button class="btn outline" id="filebtn">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        选择文件
      </button>
      <span style="font-size:12.5px;color:var(--muted-fg)">Word · PDF · TXT · MD · 图片（OCR）</span>
      <input type="file" id="fileinput" accept=".docx,.pdf,.md,.markdown,.txt,.png,.jpg,.jpeg,.webp" style="display:none">
    </div>
    <div id="filechip"></div>
    <div class="sec" style="margin-top:14px"><span class="n">2</span>或粘贴文本</div>
    <textarea id="text" placeholder="粘贴讲义片段，支持句式：X 是 Y / X 包括 A、B / A 导致 B / 数字年代事实"></textarea>
    <div class="row">
      <button class="chip" data-demo="words">考研英语词表</button>
      <button class="chip" data-demo="bio">生物·细胞</button>
      <button class="chip" data-demo="hist">中国近代史</button>
      <button class="chip" data-demo="cs">计算机网络</button>
      <button class="chip" data-demo="med">医学·免疫</button>
    </div>
    <button class="btn" id="go">
      <svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      生成卡片
    </button>
    <div class="msg" id="msg"></div>

    <div id="listwrap" style="display:none">
      <div class="sec" style="margin-top:18px"><span class="n">3</span>卡片列表</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" placeholder="搜索问题或答案…">
      </div>
      <div class="count-row"><span class="cnt" id="count"></span>
        <div class="exports">
          <button class="btn outline" id="study-go">▶ 开始学习</button>
          <button class="btn outline" id="exp-menu">⬇ 导出</button>
        </div>
      </div>
      <div id="expbox" style="display:none" class="exports">
        <button class="btn outline" data-fmt="tsv">TSV</button>
        <button class="btn outline" data-fmt="csv">CSV</button>
        <button class="btn outline" data-fmt="json">JSON</button>
        <button class="btn outline" data-fmt="md">Markdown</button>
      </div>
      <div class="clist" id="clist"></div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="obar">
    <button class="x" id="ox">✕</button>
    <div class="prog"><i id="oprogress"></i></div>
    <span class="cnt" id="ocount"></span>
  </div>
  <div class="ocard-area">
    <div class="ocard" id="ocard">
      <div id="ofront-side">
        <div class="meta"><span class="tag" id="otag">新卡片</span><span class="speak" id="ospeak" title="发音" onclick="event.stopPropagation();speak($('oq').textContent)"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></span></div>
        <div class="q" id="oq" onclick="showBack()"></div>
        <div class="hint">点击卡片或按空格显示答案</div>
      </div>
      <div id="oback-side" style="display:none">
        <div class="qkeep" id="oqkeep"></div>
        <div class="a" id="oa"></div>
        <div class="src" id="osrc"></div>
      </div>
    </div>
    <div class="grades" id="grades">
      <button class="g1" onclick="grade(1)">忘记<small>1</small></button>
      <button class="g2" onclick="grade(2)">困难<small>2</small></button>
      <button class="g3" onclick="grade(3)">良好<small>3</small></button>
      <button class="g4" onclick="grade(4)">简单<small>4</small></button>
    </div>
    <div class="hint" style="text-align:center;font-size:11.5px;color:#a1a1aa;padding-top:8px" id="swipe-hint">
      ← 左滑标忘 · 右滑记住 →（也可点卡片翻面）
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let CARDS = [];
let FSRS_LIB = null;
import('https://cdn.jsdelivr.net/npm/ts-fsrs@5/+esm').then(m => { FSRS_LIB = m; }).catch(() => {});
const LS_KEY = 'anki-forge-demo-progress';
function loadProgress() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function saveProgress(p) { try { localStorage.setItem(LS_KEY, JSON.stringify(p)); } catch {} }
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return 'k' + Math.abs(h).toString(36); }

const DEMOS = {
  words: [
    ['abandon', 'v. 放弃，抛弃', 'He was forced to abandon the plan.'],
    ['abundant', 'adj. 丰富的，充裕的', 'The region has abundant natural resources.'],
    ['accelerate', 'v. 加速，促进', 'Stress can accelerate the aging process.'],
    ['alleviate', 'v. 减轻，缓解', 'The medicine alleviated his pain quickly.'],
    ['ambiguous', 'adj. 模棱两可的', 'His answer was deliberately ambiguous.'],
    ['anticipate', 'v. 预期，预料', 'We anticipate strong opposition to the plan.'],
    ['compensate', 'v. 补偿，弥补', 'Nothing can compensate for the loss of time.'],
    ['crucial', 'adj. 至关重要的', 'Reading plays a crucial role in learning.'],
    ['deteriorate', 'v. 恶化，变坏', 'His health deteriorated rapidly last winter.'],
    ['facilitate', 'v. 促进，使便利', 'The new system facilitates online learning.'],
  ],
  bio: '线粒体是细胞进行有氧呼吸的主要场所，被称为细胞的动力车间。\n叶绿体是绿色植物进行光合作用的场所。\n细胞器包括线粒体、内质网、核糖体、高尔基体和溶酶体。\n糖类是生物体的主要能源物质。DNA 携带着生物体的遗传信息。\n蛋白质是生命活动的主要承担者，其基本组成单位是氨基酸。',
  hist: '鸦片战争是 1840 年爆发的近代史开端事件。《南京条约》是中国近代史上第一个不平等条约。\n洋务运动是一场自上而下的自救运动。甲午战争战败标志着洋务运动的破产。\n辛亥革命推翻了清王朝的统治。五四运动是一场彻底的反帝反封建爱国运动。\n1921 年是中国共产党成立的时间。遵义会议是党的历史上生死攸关的转折点。',
  cs: 'TCP 是一种面向连接的可靠传输协议。UDP 是一种无连接的不可靠传输协议。\nHTTP 的常见状态码包括 200、301、404 和 500。\nDNS 的作用是将域名解析为 IP 地址。\n三次握手是 TCP 建立连接的过程。包丢失会导致数据传输不完整。\nHTTPS 是在 HTTP 基础上加入 TLS 加密层的协议。',
  med: '免疫系统是人体抵御病原体的防御体系。抗原是指能够触发免疫应答的物质。\n抗体包括 IgG、IgA、IgM、IgE 和 IgD 五类。\n炎症反应会导致局部红肿热痛。疫苗通过诱导机体产生抗体和记忆细胞来提供保护。\n过敏反应是免疫系统对无害物质的过度应答。',
};
$('demos').onclick = (e) => {
  const d = e.target.dataset.demo; if (!d) return;
  if (d === 'words') {
    $('text').value = DEMOS.words.map(([w, def, ex]) => w + ' ' + def + '。例：' + ex).join('\n');
  } else {
    $('text').value = DEMOS[d];
  }
  generate();
};

// ---- 智能文件导入（编码检测 / Word / PDF / 图片 OCR）----
function decodeXmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function readTextSmart(buf) {
  let text = new TextDecoder('utf-8').decode(buf);
  const bad = (text.match(/\uFFFD/g) || []).length;
  if (bad > Math.max(1, text.length * 0.005)) {
    try { text = new TextDecoder('gbk').decode(buf); } catch {}
  }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text;
}
function parseDocxBrowser(arrayBuf) {
  const zip = fflate.unzipSync(new Uint8Array(arrayBuf));
  const xmlEntry = Object.keys(zip).find((k) => k === 'word/document.xml');
  if (!xmlEntry) throw new Error('不是有效的 .docx 文件');
  const xml = new TextDecoder().decode(zip[xmlEntry]);
  const paras = [...xml.matchAll(/<w:p[ >]([\s\S]*?)<\/w:p>/g)]
    .map((m) => [...m[1].matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)]
      .map((t) => decodeXmlEntities(t[1].replace(/\s+/g, ' '))).join(''))
    .map((p) => p.trim()).filter(Boolean);
  if (paras.join('').length < 20) throw new Error('Word 文档几乎没有文字——扫描图片请导入图片（自动 OCR）');
  return paras.join('\n');
}
async function parsePdfBrowser(arrayBuf) {
  await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/legacy/build/pdf.min.mjs', 'module');
  const pdfjs = window.pdfjsLib;
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/legacy/build/pdf.worker.min.mjs';
  const doc = await pdfjs.getDocument({ data: arrayBuf }).promise;
  const parts = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const line = tc.items.map((it) => it.str).join(' ').replace(/\s+/g, ' ').trim();
    if (line) parts.push('【第' + p + '页】' + line);
  }
  const text = parts.join('\n');
  if (text.replace(/【[^】]*】/g, '').trim().length < 20) throw new Error('PDF 没有文字层——扫描版请导入图片（自动 OCR）');
  return text;
}
async function ocrImageBrowser(arrayBuf) {
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  if (!window.__ocrWorker) {
    window.__ocrWorker = await Tesseract.createWorker(['chi_sim', 'eng'], 1, { logger: () => {} });
  }
  const { data: { text } } = await window.__ocrWorker.recognize(new Blob([arrayBuf]));
  return text.replace(/\n{3,}/g, '\n\n').trim();
}
function loadScript(src, type) {
  window.__loadedScripts = window.__loadedScripts || {};
  if (window.__loadedScripts[src]) return window.__loadedScripts[src];
  window.__loadedScripts[src] = type === 'module'
    ? import(src)
    : new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = src; s.onload = res;
        s.onerror = () => rej(new Error('资源加载失败：' + src));
        document.head.appendChild(s);
      });
  return window.__loadedScripts[src];
}
async function smartReadFile(f) {
  const buf = await f.arrayBuffer();
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (ext === 'docx') return parseDocxBrowser(buf);
  if (ext === 'pdf') return parsePdfBrowser(buf);
  if (['png', 'jpg', 'jpeg', 'webp', 'bmp'].includes(ext)) {
    msg('正在 OCR 识别图片文字（首次会下载识别模型）…');
    return ocrImageBrowser(buf);
  }
  return readTextSmart(buf);
}
$('filebtn').onclick = () => $('fileinput').click();
$('fileinput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    msg('正在读取 ' + f.name + ' …');
    const text = await smartReadFile(f);
    if (!text.trim()) throw new Error('文件内容为空');
    $('text').value = text;
    msg('✓ 已载入 ' + f.name + '，点「生成卡片」');
    generate();
  } catch (err) { msg(err.message, true); }
};
function clearFile() { $('fileinput').value = ''; $('text').value = ''; }

function sentences(text) {
  return text.replace(/([。！？!?；;])\s*/g, '$1\n').split(/\n+/)
    .map((s) => s.replace(/^[\s•·\-*\d]+[.、)\]]*\s*/, '').trim()).filter((s) => s.length >= 7);
}
function stripModal(x) { return x.replace(/(?:会|将|可能|能)$/, '') || x; }
function rules() {
  return [
    { re: /^(.{2,40}?)(?:是指|指的是|就是|是|称为|叫做)(.{4,160})[。．；;]?$/, make: (m) => ({ front: '什么是' + m[1].trim() + '？', back: m[2].trim() }) },
    { re: /^(.{2,30}?)(?:包括|分为|包含|有以下|可分成)(.{4,180})[。；;]?$/, make: (m) => ({ front: m[1].trim() + '包括哪些内容？', back: m[2].trim() }) },
    { re: /^(.{3,50}?)(?:导致|引起|造成|使得|促使)(.{4,140})[。．；;]?$/, make: (m) => ({ front: stripModal(m[1].trim()) + '会导致什么？', back: m[2].trim() }) },
    { re: /^(.{2,36}?)(?:是|为|达到|约|大约|共)(\s*(?:公元)?\d[\d,.]*\s*(?:年|个|%|％|倍|千米|公里|米|克|千克|万吨|亿))[^。；]{0,60}[。；;]?$/, make: (m) => ({ front: m[1].trim() + '是多少？', back: m[2].trim() }) },
    { re: /^(.{2,60}?)\s+(?:is|are|refers to|means|is defined as)\s+(.{4,200})[.;]?$/i, make: (m) => ({ front: 'What is ' + m[1].trim() + '?', back: m[2].trim() }) },
    { re: /^(.{2,40}?)\s+(?:includes|consists of|comprises|is divided into)\s+(.{4,200})[.;]?$/i, make: (m) => ({ front: 'What does ' + m[1].trim() + ' include?', back: m[2].trim() }) },
    { re: /^(.{3,60}?)\s+(?:causes|leads to|results in)\s+(.{4,180})[.;]?$/i, make: (m) => ({ front: 'What does ' + m[1].trim() + ' lead to?', back: m[2].trim() }) },
  ];
}
function extractCards(text, cap) {
  const out = []; const seen = new Set();
  for (const s of sentences(text)) {
    if (out.length >= cap) break;
    for (const r of rules()) {
      const m = s.match(r.re);
      if (!m) continue;
      let c; try { c = r.make(m); } catch { continue; }
      if (!c.front || !c.back || c.front.length < 4 || c.front.length > 80 || c.back.length < 3 || c.back.length > 220) continue;
      const key = c.front.toLowerCase().replace(/\s+/g, ' ');
      if (seen.has(key)) continue;
      seen.add(key); out.push(c); break;
    }
  }
  return out;
}

function generate() {
  const text = $('text').value.trim();
  if (!text) return msg('先粘贴材料，或点上方示例', true);
  const lines = text.split(/\n+/).filter((l) => l.trim());
  const wordLines = lines.filter((l) => /^[a-zA-Z][\w'-]*\s/.test(l.trim())).length;
  const isWords = lines.length > 0 && wordLines / lines.length > 0.6;
  CARDS = isWords
    ? text.split(/\n+/).map((l) => l.trim()).filter(Boolean).map((l) => {
        const m = l.match(/^(\S+)\s+(.+?)(?:。\s*例：(.+?))?\.?$/);
        return m ? { front: m[1], back: (m[2] || '') + (m[3] ? '\n' + m[3] : ''), source: '' } : null;
      }).filter(Boolean)
    : extractCards(text, 60);
  if (CARDS.length === 0) return msg('没能抽出卡片——需要「X 是 Y」「X 包括…」「A 导致 B」或词表行', true);
  msg('✓ 生成 ' + CARDS.length + ' 张卡片。点击问题看答案，或开始学习。');
  $('search').value = '';
  renderList('');
  $('listwrap').style.display = 'block';
}
$('go').onclick = generate;

$('search').oninput = (e) => renderList(e.target.value.trim().toLowerCase());
function renderList(q) {
  const shown = CARDS.filter((c) => !q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q));
  $('count').textContent = '共 ' + CARDS.length + ' 张' + (q ? '，匹配 ' + shown.length + ' 张' : '');
  $('clist').innerHTML = shown.length === 0
    ? '<div class="empty">没有匹配的卡片</div>'
    : shown.map((c) => {
        const i = CARDS.indexOf(c);
        return '<div class="citem" data-i="' + i + '">' +
          '<div class="qrow" onclick="this.parentElement.classList.toggle(\'open\')">' +
          '<span class="qnum">' + (i + 1) + '</span><div class="qtext">' + esc(c.front) + '</div>' +
          '<svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>' +
          '<div class="atext">' + esc(c.back).replace(/\n/g, '<br>') +
          (c.source ? '<div class="src">📍 ' + esc(c.source) + '</div>' : '') + '</div></div>';
      }).join('');
}

let STUDY = null;
$('study-go').onclick = () => {
  if (CARDS.length === 0) return;
  const progress = loadProgress();
  const now = Date.now();
  STUDY = {
    deck: '体验牌组',
    cards: CARDS.map((c) => {
      const key = hash(c.front);
      const saved = progress[key];
      return { ...c, key, due: saved ? saved.due : 0, state: saved ? saved.state : 0, reps: saved ? saved.reps : 0 };
    }),
    queue: [], index: 0, done: 0, again: 0,
  };
  STUDY.queue = STUDY.cards.filter((c) => c.due <= now).sort((a, b) => a.due - b.due);
  if (STUDY.queue.length === 0) STUDY.queue = [...STUDY.cards].sort((a, b) => a.due - b.due).slice(0, 10);
  $('overlay').classList.add('on');
  renderStudy();
};

function renderStudy() {
  if (STUDY.index >= STUDY.queue.length) {
    const acc = STUDY.done ? Math.round((STUDY.done - STUDY.again) / STUDY.done * 100) : 100;
    $('ocard').innerHTML = '<div class="done-box"><div class="big">本轮完成</div>' +
      '<div class="sub">复习 ' + STUDY.done + ' 张 · 标忘 ' + STUDY.again + ' 张 · 正确率 ' + acc + '%<br>标忘的卡会更快回来。进度已保存。</div>' +
      '<button class="btn" style="margin:16px auto 0;width:auto;padding:0 18px;min-height:38px" onclick="location.reload()">再学一轮</button></div>';
    $('grades').style.display = 'none';
    $('swipe-hint').textContent = '';
    $('ocount').textContent = '';
    return;
  }
  const c = STUDY.queue[STUDY.index];
  $('ofront-side').style.display = 'block';
  $('oback-side').style.display = 'none';
  $('grades').style.display = 'none';
  $('swipe-hint').style.display = 'block';
  $('otag').textContent = c.state === 0 ? '新卡片' : '复习 · 第 ' + (c.reps + 1) + ' 次';
  $('oq').textContent = c.front;
  $('oqkeep').textContent = c.front;
  $('oa').textContent = c.back || '（无补充）';
  $('osrc').textContent = c.source ? '📍 ' + c.source : '';
  $('ospeak').style.display = /[a-zA-Z]{3,}/.test(c.front) ? 'inline-flex' : 'none';
  $('ocard').style.transform = '';
  $('ocard').style.animation = 'none';
  void $('ocard').offsetHeight;
  $('ocard').style.animation = 'fade .25s both';
  $('oprogress').style.width = Math.round(STUDY.index / STUDY.queue.length * 100) + '%';
  $('ocount').textContent = (STUDY.index + 1) + '/' + STUDY.queue.length;
}
function showBack() {
  $('ofront-side').style.display = 'none';
  $('oback-side').style.display = 'block';
  $('grades').style.display = 'grid';
  $('swipe-hint').style.display = 'none';
}
$('ocard').onclick = () => {
  if ($('oback-side').style.display !== 'block') showBack();
};
$('ospeak').onclick = (e) => { e.stopPropagation(); speak($('oq').textContent); };

async function grade(rating) {
  const c = STUDY.queue[STUDY.index];
  if (rating === 1) STUDY.again++;
  STUDY.done++; STUDY.index++;
  const progress = loadProgress();
  const entry = progress[c.key] || { state: 0, due: 0, reps: 0 };
  entry.reps++;
  if (FSRS_LIB) {
    try {
      const { fsrs, generatorParameters, createEmptyCard } = FSRS_LIB;
      const sched = fsrs(generatorParameters({ enable_fuzz: true }));
      const fsrsCard = entry.fsrsCard || createEmptyCard(new Date());
      const next = sched.next(fsrsCard, new Date(), rating);
      entry.fsrsCard = { due: next.card.due.toISOString(), stability: next.card.stability, state: next.card.state };
      entry.due = next.card.due.getTime();
      entry.state = next.card.state;
    } catch { entry.due = Date.now() + (rating === 1 ? 60000 : rating === 2 ? 21600000 : 86400000); }
  } else {
    entry.due = Date.now() + (rating === 1 ? 60000 : rating === 2 ? 21600000 : 86400000);
  }
  progress[c.key] = entry;
  saveProgress(progress);
  renderStudy();
}

// 滑动评分（pointer 统一触摸/鼠标）
(function attachSwipe() {
  const card = $('ocard');
  let startX = null, dx = 0;
  card.addEventListener('pointerdown', (e) => {
    if ($('oback-side').style.display === 'block') return;
    startX = e.clientX; dx = 0; card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e) => {
    if (startX === null) return;
    dx = e.clientX - startX;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + dx * 0.04 + 'deg)';
  });
  card.addEventListener('pointerup', (e) => {
    if (startX === null) return;
    card.style.transition = 'transform .25s';
    if (Math.abs(dx) > 90) {
      const dir = dx > 0 ? 1 : -1;
      card.style.transform = 'translateX(' + dir * 480 + 'px) rotate(' + dir * 22 + 'deg)';
      setTimeout(() => { card.style.transform = ''; grade(dir > 0 ? 3 : 1); }, 160);
    } else {
      card.style.transform = '';
    }
    startX = null;
  });
})();

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text || '');
    u.lang = /[\u4e00-\u9fa5]/.test(text) ? 'zh-CN' : 'en-US';
    u.rate = 0.92;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch {}
}
$('ox').onclick = () => { $('overlay').classList.remove('on'); renderList($('search').value.trim().toLowerCase()); };

function msg(m, isErr) {
  $('msg').innerHTML = '<div class="' + (isErr ? 'msg err' : 'msg ok') + '" style="display:block">' + esc(m) + '</div>';
}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 导出菜单（多格式）
$('exp-menu').onclick = () => {
  const b = $('expbox');
  b.style.display = b.style.display === 'flex' ? 'none' : 'flex';
};
$('expbox').onclick = async (e) => {
  const fmt = e.target.dataset.fmt;
  if (!fmt) return;
  let content, mime, ext;
  if (fmt === 'json') { content = JSON.stringify(CARDS.map(({ front, back, source, tags }) => ({ front, back, source, tags })), null, 2); mime = 'application/json'; ext = 'json'; }
  else if (fmt === 'csv') { content = 'front,back,source\n' + CARDS.map((c) => [csvCell(c.front), csvCell(c.back), csvCell(c.source)].join(',')).join('\n'); mime = 'text/csv'; ext = 'csv'; }
  else if (fmt === 'md') { content = CARDS.map((c, i) => (i + 1) + '. **' + c.front + '**\n   ' + c.back.replace(/\n/g, ' ')).join('\n\n'); mime = 'text/markdown'; ext = 'md'; }
  else { content = tsvText(); mime = 'text/plain;charset=utf-8'; ext = 'txt'; }
  download('anki-forge-cards.' + ext, content, mime);
};
function csvCell(s) { return '"' + String(s ?? '').replace(/"/g, '""') + '"'; }
function tsvText() { return CARDS.map((c) => [c.front, c.back.replace(/\n/g, ' '), (c.tags || []).join(' ')].join('\t')).join('\n'); }
function download(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

document.addEventListener('keydown', (e) => {
  if (!$('overlay').classList.contains('on')) return;
  if (e.code === 'Space' && $('oback-side').style.display !== 'block') { e.preventDefault(); showBack(); }
  if (['1', '2', '3', '4'].includes(e.key) && $('oback-side').style.display === 'block') { e.preventDefault(); grade(Number(e.key)); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
